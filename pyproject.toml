[project]
name = "zebra-printer-daily"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frank Zhang", email = "frankj.zhang@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "numpy>=2.4.6",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "zebrafy>=2.0.0",
]

[project.scripts]
zebra-printer-daily = "zebra_printer_daily.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length=200

[tool.pyright]
# Downgrade noisy rules from errors to warnings. They still show in the editor.
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
